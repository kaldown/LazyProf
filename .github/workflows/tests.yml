name: Tests

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run tests
        run: bash scripts/run_tests.sh
